<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduCore — Responsive School Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="sidebar-overlay" class="overlay" onclick="toggleMenu()"></div>

  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <img src="assets/logo.svg" alt="EduCore Logo" />
        <div>
          <h2>EduCore</h2>
          <span>100% JS ERP</span>
        </div>
        <button class="close-btn" onclick="toggleMenu()" aria-label="Close Menu">&times;</button>
      </div>

      <nav class="nav-list">
        <button class="nav-link active" data-view="dashboard" onclick="navigate('dashboard', this)">Dashboard</button>
        <button class="nav-link" data-view="students" onclick="navigate('students', this)">Students Directory</button>
        <button class="nav-link" data-view="teachers" onclick="navigate('teachers', this)">Faculty & Teachers</button>
        <button class="nav-link" data-view="attendance" onclick="navigate('attendance', this)">Daily Attendance</button>
        <button class="nav-link" data-view="fees" onclick="navigate('fees', this)">Fee Management</button>
      </nav>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger-btn" onclick="toggleMenu()" aria-label="Open Menu">&#9776;</button>
          <h1 id="view-title">Dashboard</h1>
        </div>
        <span id="connection-badge" class="status-badge">Connected (Node.js)</span>
      </header>

      <section id="app-content" class="content-area"></section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
